name: Retrieval Regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-retrieval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      HF_HUB_OFFLINE: '1'
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      CLAUDE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-offline.txt
      - name: Dense retrieval regression (Recall@5 >= 0.90, MRR >= 0.85, nDCG@5 >= 0.85)
        run: python -m src.evaluation.regression_runner --dataset eval/fixtures/queries.jsonl --corpus eval/fixtures/corpus --mode dense --min-recall 0.9
      - name: BM25 retrieval regression
        run: python -m src.evaluation.regression_runner --dataset eval/fixtures/queries.jsonl --corpus eval/fixtures/corpus --mode bm25 --min-recall 0.9
      - name: Hybrid retrieval regression
        run: python -m src.evaluation.regression_runner --dataset eval/fixtures/queries.jsonl --corpus eval/fixtures/corpus --mode hybrid --min-recall 0.9
      - name: Diagnostic suite (hybrid over diagnostic fixtures)
        run: python -m src.evaluation.regression_runner --dataset eval/fixtures/diagnostic_queries.jsonl --corpus eval/fixtures/corpus --mode hybrid --min-recall 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-reports
          path: eval/reports/*.json
