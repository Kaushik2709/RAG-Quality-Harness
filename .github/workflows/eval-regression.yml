name: RAG Quality Gate & Evaluation Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    paths:
      - 'src/retrieval/**'
      - 'src/generation/**'
      - 'src/ingestion/**'
      - 'src/evaluation/**'
      - 'src/config.py'
      - 'eval/**'

jobs:
  evaluate-regression:
    name: Run RAG Quality Gate Suite
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/unit/

      - name: Run Evaluation Regression Quality Gate
        run: |
          python -m src.evaluation.regression_runner

